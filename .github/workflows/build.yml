# dsh-desktop-zero — GitHub Actions 自动打包发布
# 触发：推送 v* 标签（如 v0.1.0）
# 产出：NSIS 安装版 + Portable 便携版两个 .exe，并发布到 Releases

name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build installers
        run: npm run build

      # 用 GitHub 官方 CLI（gh）发布 Releases：
      # gh 直接使用仓库自动生成的 GITHUB_TOKEN，无需额外配置。
      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" dist/*.exe `
            --title "${{ github.ref_name }}" `
            --notes "dsh-desktop-zero ${{ github.ref_name }}（非官方社区封装版）"
