<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>dsh-desktop-zero</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: transparent;   /* 窗口透明背景，只显示圆形图 */
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      user-select: none;
    }

    .splash-root {
      width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      /* 柔和阴影：让透明窗在任意壁纸上都清晰 */
      filter: drop-shadow(0 8px 32px rgba(0, 0, 0, 0.45));
    }

    .splash-logo {
      width: 440px;
      height: 440px;
      border-radius: 50%;
      object-fit: contain;
      margin-bottom: 56px;
    }

    .splash-status {
      display: flex;
      align-items: center;
      gap: 18px;
      font-size: 26px;
      font-weight: 300;
      letter-spacing: 1.5px;
      color: #ffffff;
      background: rgba(0, 0, 0, 0.35);   /* 半透明底衬，保证任何壁纸上可读 */
      padding: 14px 28px;
      border-radius: 40px;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8);
      white-space: nowrap;
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(255, 255, 255, 0.2);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="splash-root">
    <img class="splash-logo" src="splash.png" alt="dsh-desktop-zero" />
    <div class="splash-status">
      <div class="spinner"></div>
      <span>正在启动 dsh-desktop-zero...</span>
    </div>
  </div>
</body>
</html>
